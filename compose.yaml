name: polyglot-persistence-lab-block-1

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
      MSSQL_PID: "Developer"
      MSSQL_DATABASE: "Visons"
    ports:
      - "1433:1433"
    volumes:
      - ./db/sqlserver:/lab
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        sleep 15
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'Visons') BEGIN CREATE DATABASE Visons; END;"
        cd /lab
        chmod +x run.sh
        ./run.sh
        wait

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ADMIN_USER:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ADMIN_PASSWORD:-admin123}"
      MONGO_DATABASE: "Visons"
    ports:
      - "27017:27017"
    volumes:
      - ./db/mongodb:/lab
    command:
      - /bin/bash
      - -c
      - |
        docker-entrypoint.sh mongod &
        sleep 10
        cd /lab
        chmod +x run.sh
        export MONGO_ADMIN_USER="$${MONGO_INITDB_ROOT_USERNAME}"
        export MONGO_ADMIN_PASSWORD="$${MONGO_INITDB_ROOT_PASSWORD}"
        ./run.sh
        wait
