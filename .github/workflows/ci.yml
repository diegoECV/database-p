name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Copiar variables de entorno
        run: cp .env.example .env

      - name: Construir y levantar contenedores (SQL Server, Mongo, Checker)
        run: |
          export PROJECT_NAME="visons-ci"
          export HTTP_PORT="9090"
          docker compose --project-name "$PROJECT_NAME" -f compose.yaml -f compose.build.yaml build
          docker compose --project-name "$PROJECT_NAME" --env-file .env -f compose.yaml -f compose.build.yaml up -d --wait

      - name: Esperar inicializacion de Java
        run: sleep 5

      - name: Ejecutar Checker de Contrato
        run: |
          export HTTP_PORT="9090"
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 2 "http://127.0.0.1:$HTTP_PORT/diagnostics"

      - name: Limpiar el entorno
        if: always()
        run: docker compose --project-name "visons-ci" down --volumes --remove-orphans
