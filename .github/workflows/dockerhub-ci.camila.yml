name: Docker Hub CI - Camila (Database)

on:
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - "db/**"
      - "check/**"
      - "compose*.yaml"
      - ".github/workflows/dockerhub-ci.camila.yml"
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: visons-db-sqlserver
            context: ./db/sqlserver
            dockerfile: ./db/sqlserver/Dockerfile
          - image: visons-db-mongodb
            context: ./db/mongodb
            dockerfile: ./db/mongodb/Dockerfile
          - image: visons-checker
            context: ./check
            dockerfile: ./check/Dockerfile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
