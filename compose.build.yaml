name: polyglot-persistence-lab-block-1-build

services:
  sqlserver:
    build:
      context: ./db/sqlserver
      args:
        RELEASE_VERSION: development
        GIT_SHA: unknown
    image: visons-db-sqlserver:local

  mongodb:
    build:
      context: ./db/mongodb
      args:
        RELEASE_VERSION: development
        GIT_SHA: unknown
    image: visons-db-mongodb:local

  checker:
    build:
      context: ./check
    image: visons-checker:local
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      SQL_URL: jdbc:sqlserver://sqlserver:1433;databaseName=Visons;encrypt=false
      SQL_USER: sa
      SQL_PASSWORD: ${MSSQL_SA_PASSWORD:-Password123!}
      MONGO_HOST: mongodb
      MONGO_DATABASE: Visons
      MONGO_USER: ${MONGO_ADMIN_USER:-admin}
      MONGO_PASSWORD: ${MONGO_ADMIN_PASSWORD:-admin123}
      MONGO_AUTH_SOURCE: admin
      EXPECTED_SCHEMA_VERSION: latest
    depends_on:
      - sqlserver
      - mongodb
